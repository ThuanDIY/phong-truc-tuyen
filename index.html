<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Energy Phước Hữu</title>
<style>
  :root{
    --bg1:#0f2a44; --bg2:#1d6fa5; --card:#ffffff; --text:#1c2733; --muted:#5b6b7b;
    --accent:#1d6fa5; --accent-dark:#155580;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background-color:var(--bg1);
    background-image:linear-gradient(160deg,rgba(15,42,68,.55),rgba(29,111,165,.35)),url("nen.jpg");
    background-size:cover;background-position:center;background-repeat:no-repeat;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }
  .card{
    background:rgba(255,255,255,.94);width:100%;max-width:440px;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    border-radius:20px;padding:32px 26px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .icon{
    width:72px;height:72px;margin:0 auto 16px;border-radius:50%;
    background:#e6f2fa;display:flex;align-items:center;justify-content:center;
  }
  .icon svg{width:36px;height:36px;fill:var(--accent)}
  h1{font-size:26px;margin:0 0 8px}
  p.sub{margin:0 0 24px;color:var(--muted);font-size:15px;line-height:1.5}
  a.join{
    display:block;background:var(--accent);color:#fff;text-decoration:none;
    font-size:20px;font-weight:700;padding:16px;border-radius:14px;
    transition:background .15s, transform .05s;
  }
  a.join:hover{background:var(--accent-dark)}
  a.join:active{transform:scale(.98)}
  ol{
    text-align:left;margin:26px 0 0;padding:18px 18px 18px 38px;
    background:#f4f7fa;border-radius:12px;color:var(--muted);
    font-size:14px;line-height:1.7;
  }
  ol b{color:var(--text)}
  .foot{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M15 8v8H5V8h10m1-2H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4V7a1 1 0 0 0-1-1z"/></svg>
    </div>
    <h1>Lớp học trực tuyến</h1>
    <p class="sub">Khi đến giờ học, bấm nút bên dưới để vào phòng họp.</p>

    <a class="join" href="hop.html">Tham Gia</a>

    <ol>
      <li>Bấm <b>Vào họp</b>.</li>
      <li>Cho phép trình duyệt dùng <b>camera và micro</b> khi được hỏi.</li>
      <li>Nhập <b>tên của bạn</b>, rồi bấm <b>Join meeting</b>.</li>
    </ol>
    <div class="foot">Nếu không vào được, hãy thử mở bằng Chrome hoặc Edge.</div>
    <div class="created-by">Được tạo bởi: Thuận Huỳnh</div>
  </main>
</body>
</html>
